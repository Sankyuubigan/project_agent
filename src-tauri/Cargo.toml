[package]
name = "vibebridge"
version.workspace = true
edition.workspace = true
description = "VibeBridge: мост «проект ↔ веб-чат LLM» — сборка промпта и применение правок. Без WebView2 (egui)."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.7.0", features = ["unstable"] }
tauri-plugin-logs = { path = "../../my-tauri-plugins/tauri-plugin-logs" }
tauri-plugin-egui = { path = "../../my-tauri-plugins/tauri-plugin-egui" }
# Локальная LLM (llama-server.exe) для AI-подбора файлов: Rust-API движка
# напрямую из воркера, без регистрации Tauri-плагина и без AppHandle.
tauri-plugin-llama-engine = { path = "../../my-tauri-plugins/tauri-plugin-llama-engine" }
agent-core = { path = "../crates/agent-core" }
log = "0.4"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CF_HDROP: список файлов «как из Проводника» (картинки в чат одним Ctrl+V).
clipboard-win = "5"
# PNG-кодирование картинок из буфера (чистый Rust, без cc).
png = "0.17"
# Нативные диалоги выбора папки/файлов.
rfd = "0.15"
# Экспериментальный GPUI-фронтенд (PRP 14.11.26): нативное окно без Tauri.
# Единственная GPUI-зависимость (скилл gpui-kit); слои — gpui_kit::component/base/assets.
gpui-kit = "0.9.1"

[dev-dependencies]
# Фикстура сценарного прогона AI-подбора (ai_pick_scenarios.rs).
tempfile = "3"
